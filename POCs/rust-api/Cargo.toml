[package]
name = "rust_api"
version = "0.1.0"
edition = "2021"

[dependencies]
diesel = { version = "2.1.0", features = ["postgres", "r2d2", "chrono", "uuid"] }
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7.5"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0.61"
derive_more = "0.99.17"
anyhow = "1.0.86"
r2d2 = "0.8.10"
